<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有色金属产业指标树 · Metals Framework</title>
<!-- ECharts CDN -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<!--
  有色金属产业指标树 · Metals Framework
  ========================================
  说明：真实数据应从 Zhiji API 代理接口 /api/indicator?code=XX&id=YY 获取，
        本处为纯静态 demo 数据（Math.sin + 随机噪声生成 120 点）。
  数据来源（示意）:
    - 行情数据: Zhiji 观 API   /api/indicator?code=<商品CODE>&id=<指标ID>
    - 新闻快讯: Zhiji 讯 API
    - 大宗指标: Zhiji 料 API
-->
<style>
/* ===== 全局 Dark 主题 ===== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;font-size:14px;}
a{color:#58a6ff;text-decoration:none;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}

/* ===== 页面骨架 ===== */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ===== 顶部导航栏 ===== */
#navbar{height:44px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 16px;gap:2px;flex-shrink:0;}
#navbar .brand{font-weight:600;font-size:15px;margin-right:24px;color:#58a6ff;letter-spacing:0.5px;}
#navbar .tab{padding:8px 12px;border-radius:6px;font-size:13px;color:#8b949e;transition:all .15s;}
#navbar .tab:hover{color:#e6edf3;background:#21262d;}
#navbar .tab.active{color:#e6edf3;background:#388bfd22;border-bottom:2px solid #58a6ff;}

/* ===== 品种切换条 ===== */
#commodity-bar{height:38px;background:#0d1117;border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 16px;gap:4px;flex-shrink:0;overflow-x:auto;}
#commodity-bar .cbtn{padding:5px 12px;border-radius:16px;font-size:13px;background:#21262d;color:#8b949e;border:1px solid transparent;white-space:nowrap;transition:all .15s;}
#commodity-bar .cbtn:hover{color:#e6edf3;background:#30363d;}
#commodity-bar .cbtn.active{color:#fff;background:#1f6feb;border-color:#388bfd;}

/* ===== 主体布局 ===== */
#main{display:grid;grid-template-columns:320px 1fr;flex:1;overflow:hidden;}

/* ===== 左侧目录树 ===== */
#sidenav{background:#0d1117;border-right:1px solid #21262d;display:flex;flex-direction:column;overflow:hidden;}
#search-box{padding:10px 12px;border-bottom:1px solid #21262d;}
#search-input{width:100%;padding:7px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:13px;outline:none;}
#search-input:focus{border-color:#58a6ff;box-shadow:0 0 0 2px #388bfd44;}
#search-input::placeholder{color:#484f58;}
#tree-container{flex:1;overflow-y:auto;padding:6px 0;}
#tree-container::-webkit-scrollbar{width:6px;}
#tree-container::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}

.tree-group{margin-bottom:2px;}
.tree-header{display:flex;align-items:center;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;color:#c9d1d9;border-radius:4px;margin:0 6px;transition:background .1s;}
.tree-header:hover{background:#21262d;}
.tree-header .arrow{display:inline-block;width:14px;font-size:11px;color:#8b949e;transition:transform .15s;}
.tree-header .arrow.expanded{transform:rotate(90deg);}
.tree-header .glabel{margin-left:4px;}
.tree-header.highlighted{background:#1f6feb22;color:#79c0ff;}
.tree-children{overflow:hidden;max-height:0;transition:max-height .25s ease;}
.tree-children.open{max-height:800px;}
.tree-item{display:flex;align-items:center;padding:4px 12px 4px 28px;cursor:pointer;font-size:12.5px;color:#8b949e;border-radius:4px;margin:0 6px;transition:all .12s;}
.tree-item:hover{background:#21262d;color:#e6edf3;}
.tree-item.active{background:#1f6feb44;color:#79c0ff;border-left:2px solid #58a6ff;}
.tree-item.hidden{display:none;}

/* ===== 右侧看板 ===== */
#panel{background:#0d1117;display:flex;flex-direction:column;overflow-y:auto;}
#panel-header{padding:14px 20px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#panel-header .indicator-name{font-size:17px;font-weight:600;color:#e6edf3;}
#panel-header .indicator-meta{font-size:12px;color:#8b949e;}
#panel-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#484f58;font-size:14px;flex-direction:column;gap:10px;}
#panel-empty .icon{font-size:48px;opacity:0.4;}

/* 4 子图 2x2 网格 */
#charts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;flex:1;min-height:500px;}
.chart-box{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;min-height:0;}
.chart-box .ctitle{font-size:12px;color:#8b949e;margin-bottom:6px;font-weight:500;display:flex;align-items:center;gap:6px;}
.chart-box .ctitle .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.chart-box .chart{flex:1;min-height:0;}

/* 数据卡 */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:100%;height:100%;padding:4px;}
.stat-card{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;}
.stat-card .slabel{font-size:11px;color:#8b949e;margin-bottom:4px;}
.stat-card .svalue{font-size:22px;font-weight:700;color:#e6edf3;}
.stat-card .schange{font-size:12px;margin-top:4px;font-weight:500;}
.stat-card .schange.up{color:#3fb950;}
.stat-card .schange.down{color:#f85149;}
.stat-card .schange.flat{color:#8b949e;}

/* ===== 底部状态栏 ===== */
#footer{height:26px;background:#161b22;border-top:1px solid #21262d;display:flex;align-items:center;padding:0 16px;font-size:11px;color:#484f58;gap:16px;flex-shrink:0;}
#footer .dot{width:6px;height:6px;border-radius:50%;background:#3fb950;display:inline-block;margin-right:4px;}
</style>
</head>
<body>
<div id="app">
  <!-- 顶部导航栏 -->
  <nav id="navbar">
    <div class="brand">🔷 Metals Framework</div>
    <div id="tabs"></div>
  </nav>
  <!-- 品种切换条 -->
  <div id="commodity-bar"></div>
  <!-- 主体 -->
  <div id="main">
    <aside id="sidenav">
      <div id="search-box">
        <input type="text" id="search-input" placeholder="🔍 搜索指标名称..." />
      </div>
      <div id="tree-container"></div>
    </aside>
    <section id="panel">
      <div id="panel-header">
        <span class="indicator-name">📊 指标看板</span>
        <span class="indicator-meta" id="indicator-meta">请选择左侧指标</span>
      </div>
      <div id="panel-body">
        <div id="panel-empty">
          <div class="icon">🌲</div>
          <div>从左侧目录树选择一个指标</div>
          <div style="font-size:12px;color:#30363d;">点击后显示 ECharts 四图看板</div>
        </div>
        <div id="charts" style="display:none;">
          <div class="chart-box">
            <div class="ctitle"><span class="dot" style="background:#58a6ff;"></span>时序走势</div>
            <div class="chart" id="chart-trend"></div>
          </div>
          <div class="chart-box">
            <div class="ctitle"><span class="dot" style="background:#3fb950;"></span>季节性分析</div>
            <div class="chart" id="chart-season"></div>
          </div>
          <div class="chart-box">
            <div class="ctitle"><span class="dot" style="background:#d29922;"></span>指标 vs 期货价格</div>
            <div class="chart" id="chart-dual"></div>
          </div>
          <div class="chart-box">
            <div class="ctitle"><span class="dot" style="background:#f85149;"></span>关键数据</div>
            <div id="stats-card" class="stats-grid"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div id="footer">
    <span><span class="dot"></span>在线</span>
    <span>数据源: Zhiji API (demo)</span>
    <span>框架 v1.0 · 2026-08-26</span>
    <span style="margin-left:auto;color:#30363d;">有色金属产业指标树</span>
  </div>
</div>

<script>
/* ============================================================
   有色金属产业指标树 · 主逻辑
   说明：真实数据应从 Zhiji API 代理接口 /api/indicator?code=XX&id=YY 获取，
         本处为纯静态 demo 数据（Math.sin + 随机噪声生成 120 点）。
   ============================================================ */

// ====== 全局状态 ======
const state = {
  currentCommodity: 'CU',   // 当前选中品种代码
  currentTab: 'price',      // 当前选中的 nav tab
  currentIndicator: null,   // 当前选中的指标
  config: null              // 从 data/tree_config.json 加载的配置
};

// ====== 品种图标映射 ======
const COMMODITY_ICONS = { CU:'🟤', AL:'⚪', PB:'🟢', ZN:'⚡', NI:'🔴', SN:'🟣', LC:'🔵', SI:'⚫' };

// ====== 初始化：加载配置 ======
async function init() {
  try {
    const res = await fetch('/data/tree_config.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.config = await res.json();
    renderTabs();
    renderCommodityBar();
    renderTree();
  } catch (e) {
    // 本地文件打开时 fetch 失败，使用内联兜底数据
    console.warn('fetch tree_config.json 失败，使用内联兜底:', e);
    loadFallback();
  }
}

// ====== 内联兜底配置（fetch 失败时使用）======
function loadFallback() {
  state.config = {
    nav: [
      {id:'data_entry',label:'数据入口'},{id:'price',label:'价格'},
      {id:'supply',label:'供应'},{id:'inventory',label:'库存'},
      {id:'demand',label:'需求'},{id:'trade',label:'进出口'},
      {id:'cost',label:'成本·利润'},{id:'balance',label:'供需平衡'},
      {id:'dashboard',label:'数据看板'}
    ],
    commodities: [
      {code:'CU',name:'铜',icon:'🟤'},{code:'AL',name:'铝',icon:'⚪'},
      {code:'PB',name:'铅',icon:'🟢'},{code:'ZN',name:'锌',icon:'⚡'},
      {code:'NI',name:'镍',icon:'🔴'},{code:'SN',name:'锡',icon:'🟣'},
      {code:'LC',name:'锂',icon:'🔵'},{code:'SI',name:'硅',icon:'⚫'}
    ],
    tree: [
      {id:'price',label:'价格信号',children:[
        {id:'p1',label:'期货结算价',code:'主连'},{id:'p2',label:'现货价格',code:'现货'},
        {id:'p3',label:'升贴水',code:'升贴水'},{id:'p4',label:'基差',code:'基差'},
        {id:'p5',label:'月差/期限结构',code:'月差'},{id:'p6',label:'沪伦比/进口盈亏',code:'沪伦比'}
      ]},
      {id:'supply',label:'供给',children:[
        {id:'s1',label:'矿山产量',code:'矿产量'},{id:'s2',label:'精炼产量',code:'精炼产量'},
        {id:'s3',label:'冶炼开工率',code:'开工率'},{id:'s4',label:'TC/加工费',code:'TC'},
        {id:'s5',label:'港口精矿库存',code:'港口库存'},{id:'s6',label:'冶炼利润',code:'冶炼利润'}
      ]},
      {id:'inventory',label:'库存',children:[
        {id:'i1',label:'LME库存',code:'LME库存'},{id:'i2',label:'LME仓单(注册/注销)',code:'仓单'},
        {id:'i3',label:'上期所库存/仓单',code:'SHFE库存'},{id:'i4',label:'社会库存',code:'社库'},
        {id:'i5',label:'隐性/在途库存',code:'隐性库存'},{id:'i6',label:'工厂库存',code:'工厂库存'}
      ]},
      {id:'demand',label:'需求',children:[
        {id:'d1',label:'表观消费',code:'表观消费'},{id:'d2',label:'下游开工率',code:'下游开工'},
        {id:'d3',label:'制造业PMI',code:'PMI'},{id:'d4',label:'地产/基建/汽车',code:'终端'},
        {id:'d5',label:'新能源需求',code:'新能源'},{id:'d6',label:'电网/电力',code:'电网'}
      ]},
      {id:'trade',label:'进出口',children:[
        {id:'t1',label:'原料进口',code:'原料进口'},{id:'t2',label:'精炼金属进出口',code:'进出口'},
        {id:'t3',label:'制品出口',code:'制品出口'},{id:'t4',label:'进口盈亏',code:'进口盈亏'},
        {id:'t5',label:'沪伦比',code:'沪伦比'},{id:'t6',label:'保税区库存',code:'保税区库存'}
      ]},
      {id:'cost',label:'成本·利润',children:[
        {id:'c1',label:'矿山成本曲线',code:'成本曲线'},{id:'c2',label:'冶炼利润',code:'冶炼利润'},
        {id:'c3',label:'副产收益(硫酸等)',code:'副产'},{id:'c4',label:'能源成本',code:'能源'},
        {id:'c5',label:'分位数估值',code:'分位数'}
      ]},
      {id:'balance',label:'供需平衡',children:[
        {id:'b1',label:'平衡表',code:'平衡表'},{id:'b2',label:'表观消费',code:'表观消费'},
        {id:'b3',label:'净库存变化',code:'净库存'}
      ]},
      {id:'dashboard',label:'数据看板',children:[
        {id:'x1',label:'8品种联动总览',link:'#macro'},{id:'x2',label:'持仓席位',code:'席位'},
        {id:'x3',label:'波动率',code:'波动率'}
      ]}
    ]
  };
  renderTabs();
  renderCommodityBar();
  renderTree();
}

// ====== 渲染顶部导航 tabs ======
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  state.config.nav.forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (n.id === state.currentTab ? ' active' : '');
    btn.textContent = n.label;
    btn.onclick = () => {
      state.currentTab = n.id;
      renderTabs();
      highlightTreeGroup(n.id);
    };
    tabs.appendChild(btn);
  });
}

// ====== 渲染品种切换条 ======
function renderCommodityBar() {
  const bar = document.getElementById('commodity-bar');
  bar.innerHTML = '';
  state.config.commodities.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cbtn' + (c.code === state.currentCommodity ? ' active' : '');
    btn.innerHTML = `<span>${COMMODITY_ICONS[c.code]||'🔷'}</span> ${c.code} ${c.name}`;
    btn.onclick = () => {
      state.currentCommodity = c.code;
      renderCommodityBar();
      if (state.currentIndicator) renderCharts(state.currentIndicator);
    };
    bar.appendChild(btn);
  });
}

// ====== 高亮树分区 ======
function highlightTreeGroup(groupId) {
  document.querySelectorAll('.tree-header').forEach(el => {
    el.classList.toggle('highlighted', el.dataset.gid === groupId);
  });
}

// ====== 渲染目录树 ======
function renderTree(filter = '') {
  const container = document.getElementById('tree-container');
  container.innerHTML = '';
  const fl = filter.toLowerCase();
  state.config.tree.forEach(group => {
    const grp = document.createElement('div');
    grp.className = 'tree-group';

    // 一级节点：大类
    const header = document.createElement('div');
    header.className = 'tree-header' + (group.id === state.currentTab ? ' highlighted' : '');
    header.dataset.gid = group.id;
    header.innerHTML = `<span class="arrow expanded">▶</span><span class="glabel">${group.label}</span>`;

    // 二级节点：具体指标
    const children = document.createElement('div');
    children.className = 'tree-children open';

    let anyVisible = false;
    group.children.forEach(child => {
      const match = !fl || child.label.toLowerCase().includes(fl) || (child.code && child.code.toLowerCase().includes(fl));
      if (!match) return;
      anyVisible = true;
      const item = document.createElement('div');
      item.className = 'tree-item' + (state.currentIndicator && state.currentIndicator.id === child.id ? ' active' : '');
      item.dataset.id = child.id;
      item.dataset.code = child.code || '';
      item.innerHTML = `<span>▸</span> <span style="margin-left:6px;">${child.label}</span> <span style="margin-left:auto;font-size:11px;color:#484f58;">${child.code||''}</span>`;
      item.onclick = () => selectIndicator(child, group);
      children.appendChild(item);
    });

    if (!anyVisible) {
      const none = document.createElement('div');
      none.className = 'tree-item';
      none.style.color = '#484f58';
      none.style.fontSize = '11px';
      none.textContent = '无匹配指标';
      children.appendChild(none);
    }

    header.onclick = () => {
      const isExpanded = children.classList.contains('open');
      children.classList.toggle('open');
      header.querySelector('.arrow').classList.toggle('expanded');
      state.currentTab = group.id;
      renderTabs();
      highlightTreeGroup(group.id);
    };

    grp.appendChild(header);
    grp.appendChild(children);
    container.appendChild(grp);
  });
}

// ====== 搜索框 ======
let searchTimer = null;
document.getElementById('search-input').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    renderTree(e.target.value.trim());
  }, 150);
});

// ====== 选择指标 → 显示看板 ======
function selectIndicator(child, group) {
  state.currentIndicator = child;
  state.currentTab = group.id;
  renderTabs();
  renderTree(document.getElementById('search-input').value.trim());

  document.getElementById('panel-empty').style.display = 'none';
  document.getElementById('charts').style.display = 'grid';

  document.querySelector('#panel-header .indicator-name').textContent =
    `${COMMODITY_ICONS[state.currentCommodity]||'🔷'} ${state.currentCommodity} ${child.label}`;
  document.getElementById('indicator-meta').textContent =
    `代码: ${child.code || child.id}  |  分类: ${group.label}  |  数据: demo`;

  renderCharts(child);
}

// ====== 生成 demo 数据 ======
function generateDemoData(points, seed) {
  const arr = [];
  const prices = [];
  const dates = [];
  const now = new Date();
  for (let i = 0; i < points; i++) {
    const t = i / points * Math.PI * 6;
    const base = 50 + 20 * Math.sin(t + seed) + 8 * Math.sin(t * 2.3 + seed * 1.7);
    const noise = (Math.random() - 0.5) * 6;
    const val = base + noise;
    arr.push(Math.round(val * 100) / 100);
    // 模拟期货价格（同趋势不同幅度）
    const pv = 60000 + 8000 * Math.sin(t * 0.8 + seed) + 3000 * Math.cos(t * 1.5) + (Math.random()-0.5)*2000;
    prices.push(Math.round(pv));
    // 日期
    const d = new Date(now.getTime() - (points - i) * 86400000);
    dates.push(d.toISOString().slice(5,10));
  }
  return { dates, values: arr, prices };
}

// ====== 渲染 4 张图表 ======
let charts = {};
function renderCharts(indicator) {
  const seed = hashCode(indicator.id + state.currentCommodity);
  const { dates, values, prices } = generateDemoData(120, seed);

  const darkAxis = { axisLine:{lineStyle:{color:'#30363d'}}, axisLabel:{color:'#8b949e',fontSize:10}, splitLine:{lineStyle:{color:'#21262d'}} };

  // ① 时序走势
  charts.trend = charts.trend || echarts.init(document.getElementById('chart-trend'));
  charts.trend.setOption({
    backgroundColor:'transparent',
    grid:{left:40,right:12,top:18,bottom:22},
    tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#e6edf3'}},
    xAxis:{type:'category',data:dates.slice(-30),axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{color:'#8b949e',fontSize:9,interval:8}},
    yAxis:{type:'value',...darkAxis},
    series:[{
      type:'line',data:values.slice(-30),smooth:true,symbol:'none',
      lineStyle:{color:'#58a6ff',width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(88,166,255,0.3)'},{offset:1,color:'rgba(88,166,255,0)'}]}}
    }]
  });

  // ② 季节性图：近 3 年同期叠加
  charts.season = charts.season || echarts.init(document.getElementById('chart-season'));
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const yearData = [];
  const seasonColors = ['#58a6ff','#3fb950','#d29922'];
  for (let y = 0; y < 3; y++) {
    yearData.push(months.map((_,i) => {
      const t = i/12 * Math.PI * 2;
      return Math.round(50 + 25*Math.sin(t + y + seed) + (Math.random()-0.5)*5);
    }));
  }
  charts.season.setOption({
    backgroundColor:'transparent',
    grid:{left:36,right:12,top:18,bottom:22},
    tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#e6edf3'}},
    legend:{data:['去年','前年','三年前'],textStyle:{color:'#8b949e',fontSize:10},top:0},
    xAxis:{type:'category',data:months,axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{color:'#8b949e',fontSize:9}},
    yAxis:{type:'value',...darkAxis},
    series: yearData.map((d,y) => ({
      name: ['去年','前年','三年前'][y], type:'line', data:d, smooth:true,
      lineStyle:{color:seasonColors[y],width:2,type:y===0?'solid':'dashed'}, symbol:'none'
    }))
  });

  // ③ 双轴叠加：指标 vs 期货价格
  charts.dual = charts.dual || echarts.init(document.getElementById('chart-dual'));
  charts.dual.setOption({
    backgroundColor:'transparent',
    grid:{left:40,right:44,top:18,bottom:22},
    tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',textStyle:{color:'#e6edf3'}},
    legend:{data:['指标值','期货价格'],textStyle:{color:'#8b949e',fontSize:10},top:0},
    xAxis:{type:'category',data:dates.slice(-30),axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{color:'#8b949e',fontSize:9,interval:8}},
    yAxis:[
      {type:'value',name:'指标',nameTextStyle:{color:'#58a6ff'},...darkAxis},
      {type:'value',name:'价格',nameTextStyle:{color:'#d29922'},...darkAxis}
    ],
    series:[
      {name:'指标值',type:'line',data:values.slice(-30),smooth:true,symbol:'none',lineStyle:{color:'#58a6ff',width:2},yAxisIndex:0},
      {name:'期货价格',type:'line',data:prices.slice(-30),smooth:true,symbol:'none',lineStyle:{color:'#d29922',width:2},yAxisIndex:1}
    ]
  });

  // ④ 数据卡：最新值 / 周变化 / 月变化 / 年变化
  const latest = values[values.length-1];
  const weekAgo = values[values.length-8];
  const monthAgo = values[values.length-30];
  const yearAgo = values[0];
  const weekChg = latest - weekAgo;
  const monthChg = latest - monthAgo;
  const yearChg = latest - yearAgo;
  const statsCard = document.getElementById('stats-card');
  statsCard.innerHTML = `
    ${renderStatCard('最新值', latest.toFixed(2), '—')}
    ${renderStatCard('周变化', weekChg.toFixed(2), weekChg >= 0 ? 'up' : 'down')}
    ${renderStatCard('月变化', monthChg.toFixed(2), monthChg >= 0 ? 'up' : 'down')}
    ${renderStatCard('年变化', yearChg.toFixed(2), yearChg >= 0 ? 'up' : 'down')}
  `;

  // 调整图表大小
  setTimeout(() => {
    Object.values(charts).forEach(c => c && c.resize());
  }, 100);
}

function renderStatCard(label, value, changeClass) {
  const arrow = changeClass === 'up' ? '▲' : changeClass === 'down' ? '▼' : '—';
  return `<div class="stat-card">
    <div class="slabel">${label}</div>
    <div class="svalue">${value}</div>
    <div class="schange ${changeClass}">${arrow} ${changeClass === 'flat' ? '持平' : Math.abs(parseFloat(value)).toFixed(2)}</div>
  </div>`;
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

// ====== 窗口 resize ======
window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));

// ====== 反拷贝保护 ======
document.oncontextmenu = () => false;
document.onkeydown = (e) => {
  if (e.key === 'F12') { e.preventDefault(); return false; }
  if (e.ctrlKey && ['c','C','s','S','p','P'].includes(e.key)) { e.preventDefault(); return false; }
};
document.onselectstart = () => false;
document.ondragstart = () => false;

// ====== 启动 ======
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
