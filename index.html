<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有色金属产业指标树 · Metals Framework</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#f7f5f3;color:#3a332c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;font-size:13px;line-height:1.5}
a{color:#b06a32;text-decoration:none}

/* 顶部栏 */
.topbar{background:#ede7e0;border-bottom:1px solid #d4cdc2;padding:10px 24px;display:flex;align-items:center;gap:20px}
.topbar .brand{font-weight:700;font-size:15px;color:#7a5230;display:flex;align-items:center;gap:8px;white-space:nowrap}
.topbar .brand .sq{color:#b06a32}
.topbar .brand small{font-weight:400;font-size:10px;color:#a8a49e;margin-left:6px;letter-spacing:1px}
.topbar .mtabs{display:flex;gap:2px;flex:1}
.topbar .mtab{padding:6px 12px;border-radius:4px;font-size:12px;color:#7a6f5f;cursor:pointer;background:transparent;border:none;font-family:inherit;transition:.15s}
.topbar .mtab:hover{background:#e0d8ca;color:#3a332c}
.topbar .mtab.active{background:#d9cfbc;color:#7a5230;font-weight:600}
.topbar .right{font-size:11px;color:#a8a49e;white-space:nowrap}

/* 主体 */
#app{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 52px);overflow:hidden}

/* ===== 左侧目录树 ===== */
#tree-pane{border-right:1px solid #d4cdc2;display:flex;flex-direction:column;overflow:hidden;background:#f7f5f3}
#tree-header{padding:8px 16px;border-bottom:1px solid #e0d8ca;display:flex;align-items:center;gap:10px;background:#ede7e0}
#tree-search{width:100%;padding:5px 8px;border:1px solid #c9c0ad;border-radius:3px;font-size:12px;background:#fbf8f4;color:#3a332c;outline:none;font-family:inherit}
#tree-search:focus{border-color:#b06a32}
#tree-search::placeholder{color:#b8af9e}
#tree-box{flex:1;overflow-y:auto;padding:4px 0}
#tree-box::-webkit-scrollbar{width:6px}
#tree-box::-webkit-scrollbar-thumb{background:#c9c0ad;border-radius:3px}

/* 大类卡片 */
.ncard{margin:2px 12px;border:1px solid #e0d8ca;border-radius:5px;background:#fbf8f4;overflow:hidden}
.ncard>h4{padding:7px 12px;font-size:12px;font-weight:600;color:#7a5230;display:flex;align-items:center;gap:8px;background:#ede7e0;cursor:pointer;user-select:none}
.ncard>h4 .caret{font-size:9px;color:#a8a49e;transition:.15s}
.ncard.collapsed>h4 .caret{transform:rotate(-90deg)}
.ncard.collapsed .ncard-body{display:none}
.ncard-body{padding:2px 0}

/* 指标叶行：编号 + 名称 + 问题 + 品种chip */
.t-leaf{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 20px;cursor:pointer;transition:.1s}
.t-leaf:hover{background:#f0e6da}
.t-leaf.selected{background:#e8dcc6;font-weight:500}
.tl-code{font:600 11px Consolas,monospace;color:#b06a32;min-width:36px;flex:none}
.tl-name{font-size:12.5px;color:#3a332c;flex:none;white-space:nowrap}
.tl-q{font-size:11px;color:#a8a49e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tl-comm{display:flex;gap:3px;margin-left:auto;flex:none;padding-left:6px}
.tl-comm span{padding:1px 6px;border-radius:3px;font-weight:600;color:#fff;font-size:9.5px;cursor:pointer;transition:.1s}
.tl-comm span:hover{filter:brightness(1.15)}
.tl-comm span.tl-none{background:#c9c0ad;cursor:default}

/* 展开后的品种×图表子目录 */
.t-sub{margin:1px 0 3px 52px;border-left:1px dashed #d4cdc2;padding-left:10px;max-height:0;overflow:hidden;transition:max-height .2s}
.t-sub.open{max-height:800px}
.t-subrow{display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:11.5px;color:#7a6f5f;border-radius:3px}
.t-subrow:hover{background:#f0e6da;color:#3a332c}
.tl-chip{padding:1px 5px;border-radius:3px;font-weight:600;color:#fff;font-size:9px;flex:none}
.tl-sub-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}

.t-hidden{display:none!important}

/* ===== 右侧面板 ===== */
#panel{background:#fbf8f4;display:flex;flex-direction:column;overflow-y:auto}
#panel-head{padding:14px 20px;border-bottom:1px solid #d4cdc2;background:#ede7e0}
#panel-head .pname{font-size:16px;font-weight:600;color:#3a332c;display:flex;align-items:center;gap:8px}
#panel-head .pname .pchip{padding:2px 8px;border-radius:3px;color:#fff;font-size:10px;font-weight:600}
#panel-head .pmeta{font-size:11px;color:#a8a49e;margin-top:4px}
#panel-body{padding:16px 20px;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#panel-empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:#a8a49e}
#panel-empty .icon{font-size:44px;opacity:.35}
#panel-empty .tip{font-size:12px;text-align:center;line-height:1.7;max-width:280px}
#panel-placeholder{display:none;flex-direction:column;align-items:center;gap:14px;width:100%}
#panel-placeholder.show{display:flex}
#panel-placeholder .ph-box{border:2px dashed #c9c0ad;border-radius:8px;padding:40px 30px;text-align:center;width:100%}
#panel-placeholder .ph-icon{font-size:48px;opacity:.3}
#panel-placeholder .ph-title{font-size:14px;color:#7a6f5f;font-weight:500;margin-top:8px}
#panel-placeholder .ph-note{font-size:11px;color:#a8a49e;margin-top:6px;line-height:1.6}
#panel-placeholder .ph-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;width:100%}
#panel-placeholder .ph-cell{background:#ede7e0;border-radius:5px;padding:10px 12px;text-align:left}
#panel-placeholder .ph-cell .lbl{font-size:10px;color:#a8a49e;margin-bottom:3px}
#panel-placeholder .ph-cell .val{font-size:13px;color:#3a332c;font-weight:500}

footer{max-width:1460px;margin:0 auto;padding:12px 24px 24px;color:#a8a49e;font-size:11px;border-top:1px solid #d4cdc2;margin-top:0}

@media(max-width:1000px){#app{grid-template-columns:1fr}.topbar{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="sq">▮▮</span> 有色金属研究框架 <small>METALS FRAMEWORK</small></div>
  <div class="mtabs" id="mtabs"></div>
  <div class="right">数据持续更新 · v1.0 目录树</div>
</div>
<div id="app">
  <div id="tree-pane">
    <div id="tree-header">
      <input id="tree-search" placeholder="🔍 搜索指标 / 编号 / 品种…" />
    </div>
    <div id="tree-box"></div>
  </div>
  <div id="panel">
    <div id="panel-head">
      <div class="pname"><span>📊</span> 指标看板 <span class="pchip" id="pchip" style="display:none"></span></div>
      <div class="pmeta" id="pmeta">请选择左侧指标，再点品种 chip 查看该品种数据</div>
    </div>
    <div id="panel-body">
      <div id="panel-empty">
        <div class="icon">🌲</div>
        <div class="tip">从左侧目录树选择指标<br>再点击品种 chip 切换到对应品种看板</div>
      </div>
      <div id="panel-placeholder">
        <div class="ph-box">
          <div class="ph-icon">📈</div>
          <div class="ph-title" id="ph-title">图表待接入</div>
          <div class="ph-note" id="ph-note">此指标×品种 的数据看板将通过 Zhiji API 接入</div>
          <div class="ph-meta" id="ph-meta"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<footer>
  有色金属产业指标树 · 8品种 × 8大类 · 数据源：Zhiji API · 框架版本 v1.0（2026-08-26）
</footer>
</body>

<script>
/* ============================================================
   有色金属产业指标树 · 主逻辑
   结构完全复刻 metals-framework：
   大类(展开/收起) → 指标叶行(编号+名称+问题) → 叶行右侧挂品种chip
   点品种chip = 切换当前品种+该指标 → 右侧面板显示占位
   ============================================================ */

// 配置内联（避免 GitHub Pages 对 .json Content-Type 处理异常）
window.TREE_CONFIG = {"commodities": [{"id": "cu", "code": "CU", "name": "铜", "color": "#b06a32", "anchor": "矿端定价 · 铜博士"}, {"id": "al", "code": "AL", "name": "铝", "color": "#7a8a9c", "anchor": "电力成本定价"}, {"id": "pb", "code": "PB", "name": "铅", "color": "#6b7280", "anchor": "再生铅定价"}, {"id": "zn", "code": "ZN", "name": "锌", "color": "#5b7a8c", "anchor": "矿定价消费弱"}, {"id": "ni", "code": "NI", "name": "镍", "color": "#7a8c5b", "anchor": "边际看印尼"}, {"id": "sn", "code": "SN", "name": "锡", "color": "#8c6b9c", "anchor": "矿定价电子金属"}, {"id": "li", "code": "LC", "name": "锂", "color": "#4f8a7a", "anchor": "成本曲线+政策"}, {"id": "si", "code": "SI", "name": "硅", "color": "#c08a3e", "anchor": "工业硅+多晶硅"}], "categories": [{"id": "price", "label": "价格信号", "children": [{"id": "p1", "code": "2.1", "name": "盘面结构", "q": "持仓/价/成交量", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "p2", "code": "2.2", "name": "现货与升贴水", "q": "升贴水/基差", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "p3", "code": "2.3", "name": "海外价格", "q": "LME/COMEX/现金", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "p4", "code": "2.4", "name": "价差体系", "q": "月差/期限结构", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "p5", "code": "2.5", "name": "估值与利润", "q": "分位数/冶炼利润", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "p6", "code": "2.6", "name": "持仓席位观察", "q": "多空前20", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "li"]}]}, {"id": "supply", "label": "供给", "children": [{"id": "s1", "code": "3.1.1", "name": "海外矿·财报产量", "q": "真源·季度", "comms": ["cu", "al", "pb", "zn", "ni", "sn"]}, {"id": "s2", "code": "3.1.2", "name": "海外矿·分国别总量", "q": "月/年", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "li", "si"]}, {"id": "s3", "code": "3.1.3", "name": "国内矿产量", "q": "月", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "s4", "code": "3.1.4", "name": "矿进口量与分国别", "q": "月 滞后15-20天", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "li"]}, {"id": "s5", "code": "3.1.5", "name": "TC 加工费", "q": "先行·矿紧松", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "li"]}, {"id": "s6", "code": "3.2.1", "name": "精炼产量", "q": "同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "s7", "code": "3.2.2", "name": "开工率与检修", "q": "同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "s8", "code": "3.2.3", "name": "再生/二次供应", "q": "同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "li", "si"]}, {"id": "s9", "code": "3.2.4", "name": "冶炼利润→供应弹性", "q": "先行", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}]}, {"id": "inventory", "label": "库存", "children": [{"id": "i1", "code": "4.1", "name": "交易所库存", "q": "日 同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "i2", "code": "4.2", "name": "仓单", "q": "日 同步偏领先", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "i3", "code": "4.3", "name": "社会库存", "q": "周 同步偏滞后", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "i4", "code": "4.4", "name": "工厂库存", "q": "月/周", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "i5", "code": "4.5", "name": "隐性/在途库存", "q": "周/月", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}]}, {"id": "demand", "label": "需求", "children": [{"id": "d1", "code": "5.1", "name": "初级消费", "q": "开工率 同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "d2", "code": "5.2", "name": "终端细分消费", "q": "滞后", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "d3", "code": "5.3", "name": "需求先行指标", "q": "先行1-2月", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}]}, {"id": "trade", "label": "进出口", "children": [{"id": "t1", "code": "6.1", "name": "原料进口", "q": "滞后", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "t2", "code": "6.2", "name": "精炼金属进出口", "q": "滞后", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "t3", "code": "6.3", "name": "制品出口", "q": "同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "t4", "code": "6.4", "name": "海外对华发运", "q": "先行1月", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "li"]}]}, {"id": "cost", "label": "成本·利润", "children": [{"id": "c1", "code": "7.1", "name": "成本曲线与分位", "q": "季 同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "c2", "code": "7.2", "name": "日度利润测算", "q": "日 同步", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "c3", "code": "7.3", "name": "能源/原料成本", "q": "月 先行", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}]}, {"id": "balance", "label": "供需平衡", "children": [{"id": "b1", "code": "8.1", "name": "年度锚（行业协会）", "q": "滞后定方向", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "b2", "code": "8.2", "name": "自建平衡表", "q": "季/月", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}, {"id": "b3", "code": "8.3", "name": "表观消费拟合", "q": "月", "comms": ["cu", "al", "pb", "zn", "ni", "sn", "si", "li"]}]}]};
const CFG = { commodities: TREE_CONFIG.commodities, categories: TREE_CONFIG.categories };
let state = { curComm: null, curLeaf: null, curTab: null };

function loadConfig(){
  if(!CFG.categories || !CFG.commodities){
    document.getElementById('tree-box').innerHTML =
      '<div style="padding:20px;color:#a8a49e;text-align:center">配置加载失败</div>';
    return;
  }
  renderTabs();
  renderTree();
  state.curTab = CFG.categories[0].id;
  const first = CFG.categories[0].children[0];
  selectChip(first, first.comms[0], true);
}

function renderTabs(){
  const el = document.getElementById('mtabs');
  el.innerHTML='';
  CFG.categories.forEach(c=>{
    const b=document.createElement('button');
    b.className='mtab'+(c.id===state.curTab?' active':'');
    b.textContent=c.label;
    b.onclick=()=>{
      state.curTab=c.id;
      renderTabs();
      const card=document.querySelector('.ncard[data-id="'+c.id+'"]');
      if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
    };
    el.appendChild(b);
  });
}

function renderTree(filter){
  const box=document.getElementById('tree-box');
  box.innerHTML='';
  const fl=(filter||'').toLowerCase();

  CFG.categories.forEach(cat=>{
    const card=document.createElement('div');
    card.className='ncard';
    card.dataset.id=cat.id;

    const h4=document.createElement('h4');
    h4.innerHTML='<span class="caret">▼</span><span>'+cat.label+'</span>';
    h4.onclick=(e)=>{ e.stopPropagation(); card.classList.toggle('collapsed'); };

    const body=document.createElement('div');
    body.className='ncard-body';
    let any=false;

    cat.children.forEach(leaf=>{
      const hit = !fl ||
        leaf.name.toLowerCase().includes(fl) ||
        leaf.code.toLowerCase().includes(fl) ||
        leaf.q.toLowerCase().includes(fl);
      if(!hit) return;
      any=true;

      const row=document.createElement('div');
      row.className='t-leaf'+(state.curLeaf&&state.curLeaf.id===leaf.id?' selected':'');

      const code=document.createElement('span');
      code.className='tl-code'; code.textContent=leaf.code;
      row.appendChild(code);
      const name=document.createElement('span');
      name.className='tl-name'; name.textContent=leaf.name;
      row.appendChild(name);
      const q=document.createElement('span');
      q.className='tl-q'; q.textContent=leaf.q;
      row.appendChild(q);

      const comm=document.createElement('span');
      comm.className='tl-comm';
      leaf.comms.forEach(cid=>{
        const cm = CFG.commodities.find(m=>m.id===cid);
        if(!cm) return;
        const chip=document.createElement('span');
        chip.textContent=cm.code;
        chip.style.background=cm.color;
        if(state.curLeaf&&state.curLeaf.id===leaf.id && state.curComm===cm.id){
          chip.style.outline='2px solid #7a5230';
          chip.style.outlineOffset='1px';
        }
        chip.onclick=(e)=>{ e.stopPropagation(); selectChip(leaf, cm.id, true); };
        comm.appendChild(chip);
      });
      row.appendChild(comm);
      row.onclick=()=>{ if(leaf.comms.length>0) selectChip(leaf, leaf.comms[0], true); };
      body.appendChild(row);
    });

    if(!any && fl) return;
    card.appendChild(h4);
    card.appendChild(body);
    box.appendChild(card);
  });
}

function selectChip(leaf, commId, render){
  state.curLeaf = leaf;
  state.curComm = commId;
  renderTree(document.getElementById('tree-search').value);
  const cm = CFG.commodities.find(m=>m.id===commId);
  document.getElementById('panel-empty').style.display='none';
  document.getElementById('panel-placeholder').classList.add('show');

  document.querySelector('#panel-head .pname').innerHTML =
    '<span>📊</span> '+leaf.code+' '+leaf.name+' <span class="pchip" style="background:'+cm.color+'">'+cm.code+' '+cm.name+'</span>';
  document.getElementById('pmeta').textContent =
    '类别: '+ CFG.categories.find(c=>c.id===state.curTab).label +' | 问题: '+leaf.q+' | 品种特性: '+cm.anchor;

  document.getElementById('ph-title').textContent = leaf.code+' '+leaf.name+' · '+cm.code;
  document.getElementById('ph-note').innerHTML =
    '<span class="loading" style="color:#b06a32;font-weight:500">⏳ 正在从 Zhiji 实时加载数据…</span>';

  document.getElementById('ph-meta').innerHTML =
    '<div class="ph-cell"><div class="lbl">品种</div><div class="val">'+cm.code+' '+cm.name+'</div></div>'+
    '<div class="ph-cell"><div class="lbl">指标</div><div class="val">'+leaf.code+' '+leaf.name+'</div></div>'+
    '<div class="ph-cell"><div class="lbl">数据源</div><div class="val">Zhiji API → 3天缓存</div></div>'+
    '<div class="ph-cell"><div class="lbl">状态</div><div class="val" id="ph-status">加载中…</div></div>';

  // 跳转到对应品种的子类看板（静态页）
  const PAGE_MAP = {
    'PB_i1':'pb_stock_v2.html?tab=4.1',
    'PB_i2':'pb_stock_v2.html?tab=4.2',
    'PB_i3':'pb_stock_v2.html?tab=4.3',
    'PB_i4':'pb_stock_v2.html?tab=4.4',
    'PB_i5':'pb_stock_v2.html?tab=4.5',
  };
  const key = cm.code+'_'+leaf.id;
  if(PAGE_MAP[key]){
    window.location.href = PAGE_MAP[key];
    return;
  }
  // 其余品种/子类 → 显示占位
  document.getElementById('ph-note').textContent =
    '📡 '+cm.code+' '+leaf.name+' 看板开发中 · 参考铅(PB)库存看板模板';
}

/* ---- 渲染数据（有真实数据时展示迷你图+关键数字） ---- */
function renderData(data, cm, leaf){
  const note = document.getElementById('ph-note');
  const status = document.getElementById('ph-status');

  if(data.error){
    note.textContent = '⚠️ '+data.error;
    status.textContent = '数据异常';
    return;
  }

  const pts = data.points || [];
  status.textContent = '✅ '+pts.length+' 条 · '+data.source;

  const valid = pts.filter(p=>p.value!=null && p.value!==undefined);
  if(valid.length < 2){
    note.textContent = '📭 数据为空或不足（指标 ID 可能需要重新映射）· 已缓存 '+pts.length+' 条';
    return;
  }

  // 关键数据计算
  const latest = valid[valid.length-1];
  const weekAgo = valid[Math.max(0, valid.length-8)];
  const monthAgo = valid[Math.max(0, valid.length-30)];
  const yearAgo = valid[Math.max(0, valid.length-250)];
  const wkChg = latest.value - weekAgo.value;
  const moChg = latest.value - monthAgo.value;
  const yrChg = latest.value - yearAgo.value;
  const firstDate = valid[0].date;
  const lastDate = valid[valid.length-1].date;

  note.innerHTML = '✅ 实时数据已加载 · '+firstDate+' → '+lastDate+' · 共 '+valid.length+' 条';

  // 迷你趋势条 + 数据卡
  document.getElementById('ph-meta').innerHTML =
    '<div class="ph-cell"><div class="lbl">最新值</div><div class="val" style="font-size:18px">'+formatNum(latest.value)+'</div><div style="font-size:10px;color:#a8a49e">'+latest.date+'</div></div>'+
    '<div class="ph-cell"><div class="lbl">周变化</div><div class="val" style="color:'+(wkChg>=0?'#388a30':'#c0392b')+'">'+(wkChg>=0?'▲':'▼')+' '+formatNum(Math.abs(wkChg))+'</div></div>'+
    '<div class="ph-cell"><div class="lbl">月变化</div><div class="val" style="color:'+(moChg>=0?'#388a30':'#c0392b')+'">'+(moChg>=0?'▲':'▼')+' '+formatNum(Math.abs(moChg))+'</div></div>'+
    '<div class="ph-cell"><div class="lbl">年变化</div><div class="val" style="color:'+(yrChg>=0?'#388a30':'#c0392b')+'">'+(yrChg>=0?'▲':'▼')+' '+formatNum(Math.abs(yrChg))+'</div></div>';
}

function formatNum(v){ return typeof v==='number' ? v.toLocaleString('zh-CN',{maximumFractionDigits:2}) : String(v); }

let st=null;
document.getElementById('tree-search').addEventListener('input',e=>{
  clearTimeout(st);
  st=setTimeout(()=>renderTree(e.target.value.trim()),150);
});

document.oncontextmenu=()=>false;
document.onkeydown=e=>{ if(e.key==='F12'||(e.ctrlKey&&['c','C','s','S','p','P'].includes(e.key))){ e.preventDefault(); return false; } };
document.onselectstart=()=>false;
document.ondragstart=()=>false;

window.addEventListener('DOMContentLoaded', loadConfig);
</script>

</html>
