# =============================================================================
# Framework Tree 图表元数据配置文件
# V88 元数据改造：移除独立 topic_tag，图表直接绑定 Framework Tree 节点ID
# =============================================================================
# TASK_ID: V87_RC1_G1_DSHE_OBS_CLEANUP (V88_INIT 元数据改造预研)
# AGENT: DSHE
# BRANCH: feature/v87-rc1-g1
# VERSION: v88.0.0-draft
# DATE: 2028-05-18
# STATUS: PRE_RESEARCH_PROTOTYPE
# =============================================================================

schema_version: "v88.0.0"
migration_from: "v87-topic_tag_based"
migration_to: "v88-framework_tree_node_binding"
migration_status: "PROTOTYPE_RESEARCH"

# =============================================================================
# 元数据改造核心变更说明
# =============================================================================
# 旧模型 (V87):
#   - topic_tag: "cu_price_signal"   # 独立标签，无结构约束
#   - 跨节点非法绑定可能
#   - 业务描述需手动维护
#
# 新模型 (V88):
#   - tree_node_id: "p1"             # 直接绑定Framework Tree节点ID
#   - 禁止跨节点非法绑定(强校验)
#   - 业务描述自动继承自节点定义
# =============================================================================

metadata_schema:
  chart_binding_mode: "framework_tree_node"
  topic_tag_field: "REMOVED"
  binding_reference: "data/tree_config.json"
  validation_enforcement: "STRICT"

# =============================================================================
# 强校验规则 (Validation Rules)
# =============================================================================
validation_rules:
  # 规则1: 禁止跨节点非法绑定
  # 图表绑定指标必须归属对应Framework Tree节点
  no_cross_node_binding:
    enabled: true
    severity: "ERROR"
    description: "图表绑定的指标必须归属对应Framework Tree节点的comms范围，禁止跨节点非法绑定"
    check_logic: |
      FOR EACH chart IN charts:
        FOR EACH indicator IN chart.indicators:
          IF indicator.commodity NOT IN tree_config.nodes[chart.tree_node_id].comms:
            RETURN ERROR "Indicator {indicator.commodity} is not in node {chart.tree_node_id} comms scope"

  # 规则2: 节点ID合法性校验
  tree_node_id_valid:
    enabled: true
    severity: "ERROR"
    description: "chart.tree_node_id 必须是tree_config.json中已注册的合法节点ID"
    check_logic: |
      FOR EACH chart IN charts:
        IF chart.tree_node_id NOT IN tree_config.all_node_ids:
          RETURN ERROR "Invalid tree_node_id: {chart.tree_node_id}"

  # 规则3: 商品合法性校验
  commodity_valid:
    enabled: true
    severity: "ERROR"
    description: "chart.commodity 必须是tree_config.json中已注册的合法品种ID"
    check_logic: |
      FOR EACH chart IN charts:
        IF chart.commodity NOT IN tree_config.all_commodity_ids:
          RETURN ERROR "Invalid commodity: {chart.commodity}"

  # 规则4: 业务描述自动继承校验
  auto_inherit_description:
    enabled: true
    severity: "WARN"
    description: "chart.business_description 应与tree_config.json中对应节点的name+q字段一致"
    check_logic: |
      FOR EACH chart IN charts:
        node = tree_config.nodes[chart.tree_node_id]
        expected = "{node.name}({node.q})"
        IF chart.business_description != expected:
          RETURN WARN "Description mismatch: expected {expected}, got {chart.business_description}"

  # 规则5: 图表类型合法性
  chart_type_valid:
    enabled: true
    severity: "ERROR"
    valid_types: ["time_series", "gauge", "distribution", "stacked_bar", "heatmap", "radar", "sankey", "treemap"]
    description: "chart.chart_type 必须是合法图表类型之一"

  # 规则6: 数据状态合法性
  data_status_valid:
    enabled: true
    severity: "ERROR"
    valid_statuses: ["matchable", "pending_data", "deprecated"]
    description: "chart.data_status 必须是合法数据状态之一"

# =============================================================================
# Framework Tree 节点索引 (Auto-generated from data/tree_config.json)
# =============================================================================
# 33个节点, 7个类别, 8个品种(cu/al/pb/zn/ni/sn/li/si) + ao(氧化铝,扩展)
# =============================================================================

tree_node_index:
  total_nodes: 33
  total_categories: 7
  total_commodities: 8  # cu, al, pb, zn, ni, sn, li, si

  categories:
    - id: "price"
      label: "价格信号"
      child_count: 6
      children: ["p1", "p2", "p3", "p4", "p5", "p6"]

    - id: "supply"
      label: "供给"
      child_count: 9
      children: ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9"]

    - id: "inventory"
      label: "库存"
      child_count: 5
      children: ["i1", "i2", "i3", "i4", "i5"]

    - id: "demand"
      label: "需求"
      child_count: 3
      children: ["d1", "d2", "d3"]

    - id: "trade"
      label: "进出口"
      child_count: 4
      children: ["t1", "t2", "t3", "t4"]

    - id: "cost"
      label: "成本·利润"
      child_count: 3
      children: ["c1", "c2", "c3"]

    - id: "balance"
      label: "供需平衡"
      child_count: 3
      children: ["b1", "b2", "b3"]

  commodities:
    - id: "cu"
      code: "CU"
      name: "铜"
      node_coverage: 33  # 覆盖所有33个节点
    - id: "al"
      code: "AL"
      name: "铝"
      node_coverage: 33
    - id: "pb"
      code: "PB"
      name: "铅"
      node_coverage: 33
    - id: "zn"
      code: "ZN"
      name: "锌"
      node_coverage: 33
    - id: "ni"
      code: "NI"
      name: "镍"
      node_coverage: 27  # 部分节点无覆盖
    - id: "sn"
      code: "SN"
      name: "锡"
      node_coverage: 27
    - id: "li"
      code: "LC"
      name: "锂"
      node_coverage: 27
    - id: "si"
      code: "SI"
      name: "硅"
      node_coverage: 27

