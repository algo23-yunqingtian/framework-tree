# =============================================================================
# DSHB Crawler Global Switch Configuration
# =============================================================================
# TASK_ID: V88_PHASE03_P13_DSHB_P025_CRAWLER_COMPLIANCE_REVIEW_AND_SCHEDULE_VALIDATION
# BRANCH: feature/v88-g1
# DATE: 2026-10-22
#
# WARNING: Crawler is OFF by default. Manual intervention REQUIRED to enable.
# =============================================================================
#
# HOW TO USE:
#   1. Set SWITCH=ON to enable crawler scheduling
#   2. Set MODULE and EXCHANGE to control scope
#   3. Set RATE_LIMIT_SECONDS (minimum 3.0 enforced by RateLimiter)
#   4. Set ENABLE_LIVE=true to allow actual HTTP requests
#   5. Place this file at: crawler_archive/crawler_switch.cfg
#   6. Run schedule_validator.py to verify before enabling cron
#
# CONSTRAINTS:
#   - NO_MANUAL_INTERVENTION: This file requires manual editing to change
#   - DRY_RUN_DEFAULT: ENABLE_LIVE must be explicitly set to true
#   - DUAL_KEYS: Both WIND_DATA_LINK_ONLINE.flag and HERMES_TRIGGER_AUTHORIZED.flag
#               must be FOUND before live mode is permitted
# =============================================================================

# === GLOBAL SWITCH ===
# Valid values: OFF, ON
# OFF = Crawler disabled; no scheduled tasks will execute
# ON  = Crawler enabled; scheduled tasks may execute (subject to other checks)
SWITCH=OFF

# === MODULE CONFIGURATION ===
# Valid values: exchange, industry, all
MODULE=all

# === EXCHANGE SCOPE ===
# Valid values: shfe, dce, czce, all
EXCHANGE=all

# === EXECUTION MODE ===
# Valid values: dry-run, live
# dry-run = No HTTP requests; synthetic data only (SAFE, DEFAULT)
# live    = Actual HTTP requests (REQUIRES: SWITCH=ON + ENABLE_LIVE=true + both flags FOUND)
ENABLE_LIVE=false

# === RATE LIMITING ===
# Minimum seconds between HTTP requests
# Hard floor: 3.0 seconds (enforced by RateLimiter regardless of this value)
# Recommended: 3.0 (default), 5.0 (conservative first run), 10.0 (very conservative)
RATE_LIMIT_SECONDS=3.0

# === SCHEDULE CONFIGURATION ===
# Schedule mode: crontab, windows_task_scheduler, manual
SCHEDULE_MODE=crontab

# Cron schedule (commented out until SWITCH=ON)
# Weekdays at 06:00 UTC+8 — after market close data available
# CRON_SCHEDULE=0 6 * * 1-5
# Weekdays at 06:30 — exchange data ready
# CRON_SCHEDULE_EXCHANGE=0 6 * * 1-5
# Weekdays at 07:00 — industry data ready
# CRON_SCHEDULE_INDUSTRY=0 7 * * 1-5
# Weekdays at 07:30 — field mapping
# CRON_SCHEDULE_FIELDMAP=30 7 * * 1-5
# Sunday at 09:00 — weekly integrity check
# CRON_SCHEDULE_INTEGRITY=0 9 * * 0

# === PRE-FLIGHT CHECKS ===
# Comma-separated list of checks required before live mode execution
# Valid checks: dual_keys, rate_limit, disk_space, network, robots_txt
PRE_FLIGHT_CHECKS=dual_keys,rate_limit,disk_space,network,robots_txt

# === AUDIT LOGGING ===
# Append audit records to compliance_log.jsonl
AUDIT_LOG_ENABLED=true

# === ERROR HANDLING ===
# Maximum consecutive errors before session halt
MAX_CONSECUTIVE_ERRORS=3

# Maximum requests per session
MAX_REQUESTS_PER_SESSION=100

# === NOTIFICATIONS ===
# Set to true to enable email/notification on schedule failure
NOTIFY_ON_FAILURE=false
NOTIFY_ON_SUCCESS=false

