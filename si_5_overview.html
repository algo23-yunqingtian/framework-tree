<style>*{box-sizing:border-box;margin:0;padding:0}

.badge{background:#21262d;color:#8b949e;padding:2px 8px;border-radius:10px;border:1px solid #30363d}
.badge.on{color:#c08a3e}
.note{background:#161b22;border:1px solid #30363d;border-left:3px solid #c08a3e;border-radius:6px;padding:14px 16px;font-size:13px;color:#8b949e;margin-bottom:20px}
.note b{color:#c9d1d9}
.note code{color:#c08a3e;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.footer{border-top:1px solid #21262d;padding-top:16px;font-size:12px;color:#6e7681;text-align:center}
.footer a{color:#c08a3e;text-decoration:none}
